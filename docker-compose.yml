services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: datara-backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - APP_NAME=Datara Agentic Engine
      - APP_ENV=production
      - DEBUG=false
      - PORT=8000
      - DATABASE_URL=sqlite:///./datara_metadata.db
      - DEMO_DATABASE_URL=sqlite:///./datara_demo.db
      - ALLOWED_ORIGINS=["http://localhost:3000","http://127.0.0.1:3000"]
    env_file:
      - path: ./backend/.env
        required: false
    networks:
      - datara-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
    container_name: datara-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - datara-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  datara-network:
    driver: bridge
